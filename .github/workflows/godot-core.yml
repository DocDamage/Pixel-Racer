name: Godot Core Validation

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: godot-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release metadata contract
        run: python3 tools/release/release_metadata.py check

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Godot 4.7.1
        run: |
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' /tmp/godot-import.log; then
            echo 'Godot reported a script/import error.' >&2
            exit 1
          fi

      - name: Run core tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_tests.gd
      - name: Run schema migration tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_migration_tests.gd
      - name: Run race standings tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_race_progress_tests.gd
      - name: Run presentation and collision tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_presentation_tests.gd
      - name: Run procedural option tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_generation_options_tests.gd
      - name: Run sharing package tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_sharing_tests.gd
      - name: Run save recovery tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_save_recovery_tests.gd
      - name: Run ghost persistence tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_ghost_persistence_tests.gd
      - name: Run runtime asset data tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_asset_data_tests.gd
      - name: Run runtime asset sprite tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_asset_sprite_tests.gd
      - name: Run runtime asset hazard tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_asset_hazard_tests.gd
      - name: Run builder catalog placement tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_builder_catalog_tests.gd
      - name: Run asset gallery smoke tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_asset_gallery_tests.gd
      - name: Run runtime visual theme tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_visual_theme_tests.gd
      - name: Run team presentation tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_team_presentation_tests.gd
      - name: Run audio integration tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_audio_integration_tests.gd
      - name: Run polish integration tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_polish_integration_tests.gd
      - name: Run drift scoring tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_drift_scoring_tests.gd
      - name: Run profile persistence tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_profile_persistence_tests.gd
      - name: Run dialogue persistence tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_dialogue_persistence_tests.gd
      - name: Run release readiness tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_release_readiness_tests.gd
      - name: Run controller focus/gamepad audit
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . res://tests/controller_audit_runner.tscn
      - name: Run deterministic stress tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/run_stress_tests.gd

  windows-export:
    needs: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      archive: ${{ steps.release_meta.outputs.archive }}
      artifact: ${{ steps.release_meta.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        run: python3 tools/release/release_metadata.py github-output

      - name: Install export dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Download Godot 4.7.1 and export templates
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Import project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import 2>&1 | tee /tmp/godot-export-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' /tmp/godot-export-import.log; then
            echo 'Godot reported a script/import error before export.' >&2
            exit 1
          fi

      - name: Export Windows release and reject script errors
        shell: bash
        run: |
          mkdir -p build
          set +e
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/PixelTrackWorks.exe > /tmp/godot-export.log 2>&1
          export_code=$?
          set -e
          tail -n 120 /tmp/godot-export.log || true
          grep -nE 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR:|Export failed|Cannot export' /tmp/godot-export.log || true
          if [ "$export_code" -ne 0 ]; then exit "$export_code"; fi
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' /tmp/godot-export.log; then exit 1; fi
          test -s build/PixelTrackWorks.exe

      - name: Build and verify versioned Windows bundle
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_COMMIT: ${{ github.sha }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          ARCHIVE: ${{ steps.release_meta.outputs.archive }}
        run: |
          set -euo pipefail
          rm -rf build/package
          mkdir -p build/package
          cp build/PixelTrackWorks.exe build/package/PixelTrackWorks.exe
          cp README.md build/package/README.md
          cp docs/QUICK_START.md build/package/QUICK_START.md
          cp docs/ASSET_ATTRIBUTION.md build/package/ASSET_ATTRIBUTION.md
          printf '%s\n' "$VERSION" > build/package/VERSION.txt
          {
            printf '# Pixel Track Works %s — Automated Development Build\n\n' "$VERSION"
            printf '> This is a pre-release CI package, not a production V1.0 release.\n\n'
            cat docs/RELEASE_NOTES_1.0.0_RC_DRAFT.md
          } > build/package/RELEASE_NOTES.md
          if [ -f LICENSE ]; then cp LICENSE build/package/LICENSE; fi
          python3 tools/release/release_metadata.py manifest \
            --executable build/package/PixelTrackWorks.exe \
            --output build/package/RELEASE_MANIFEST.json \
            --source-commit "$SOURCE_COMMIT" \
            --ci-commit "$CI_COMMIT" \
            --godot-version 4.7.1
          rm -f "build/$ARCHIVE" "build/$ARCHIVE.sha256"
          zip -9 -j "build/$ARCHIVE" build/package/*
          sha256sum "build/$ARCHIVE" | tee "build/$ARCHIVE.sha256"
          python3 tools/release/release_metadata.py verify-archive --archive "build/$ARCHIVE"

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PixelTrackWorks-export-diagnostics-${{ steps.release_meta.outputs.safe_version }}
          path: |
            /tmp/godot-export-import.log
            /tmp/godot-export.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_meta.outputs.artifact }}
          path: |
            build/${{ steps.release_meta.outputs.archive }}
            build/${{ steps.release_meta.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    needs: windows-export
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.windows-export.outputs.version }}
      ARCHIVE: ${{ needs.windows-export.outputs.archive }}
      ARTIFACT: ${{ needs.windows-export.outputs.artifact }}
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@v4

      - name: Download packaged Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-export.outputs.artifact }}
          path: build

      - name: Verify downloaded release contract
        shell: pwsh
        run: |
          $archivePath = Join-Path 'build' $env:ARCHIVE
          python tools/release/release_metadata.py check
          python tools/release/release_metadata.py verify-archive --archive $archivePath
          if ($LASTEXITCODE -ne 0) { throw 'Release archive contract verification failed.' }
          Expand-Archive -Path $archivePath -DestinationPath app -Force
          $required = @(
            'PixelTrackWorks.exe',
            'README.md',
            'QUICK_START.md',
            'RELEASE_NOTES.md',
            'ASSET_ATTRIBUTION.md',
            'VERSION.txt',
            'RELEASE_MANIFEST.json'
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path 'app' $name))) {
              throw "Required release file is missing after extraction: $name"
            }
          }
          $packagedVersion = (Get-Content (Join-Path 'app' 'VERSION.txt') -Raw).Trim()
          if ($packagedVersion -ne $env:VERSION) {
            throw "Packaged version $packagedVersion does not match workflow version $env:VERSION."
          }

      - name: Boot packaged executable headlessly
        shell: pwsh
        run: |
          $stdout = Join-Path $PWD 'smoke-stdout.log'
          $stderr = Join-Path $PWD 'smoke-stderr.log'
          $exe = Join-Path $PWD 'app\PixelTrackWorks.exe'
          if (-not (Test-Path $exe)) { throw 'PixelTrackWorks.exe missing after extraction.' }
          $process = Start-Process -FilePath $exe -ArgumentList @('--headless','--quit-after','2') -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged executable normal smoke timed out.'
          }
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) { throw "Packaged executable exited with code $($process.ExitCode)." }
          $combined = ''
          if (Test-Path $stdout) { $combined += (Get-Content $stdout -Raw) }
          if (Test-Path $stderr) { $combined += (Get-Content $stderr -Raw) }
          if ($combined -match 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script') {
            throw 'Packaged executable reported a script error.'
          }

      - name: Run packaged persistence and sharing self-test
        shell: pwsh
        run: |
          $stdout = Join-Path $PWD 'self-test-stdout.log'
          $stderr = Join-Path $PWD 'self-test-stderr.log'
          $exe = Join-Path $PWD 'app\PixelTrackWorks.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--headless','--','--release-self-test') -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Packaged release self-test timed out.'
          }
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          $combined = ''
          if (Test-Path $stdout) { $combined += (Get-Content $stdout -Raw) }
          if (Test-Path $stderr) { $combined += (Get-Content $stderr -Raw) }
          if ($process.ExitCode -ne 0) { throw "Packaged release self-test exited with code $($process.ExitCode)." }
          if ($combined -notmatch 'PACKAGED SELF TEST: PASS') {
            throw 'Packaged release self-test did not report PASS.'
          }
          if ($combined -match 'PACKAGED SELF TEST: FAIL|SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script') {
            throw 'Packaged release self-test reported a failure or script error.'
          }

      - name: Upload Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.windows-export.outputs.artifact }}-smoke-diagnostics
          path: |
            smoke-stdout.log
            smoke-stderr.log
            self-test-stdout.log
            self-test-stderr.log
          if-no-files-found: warn
          retention-days: 3
