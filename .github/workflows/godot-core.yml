name: Godot Core Validation

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: godot-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Godot 4.7.1
        run: |
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --editor --path . --quit-after 2 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' /tmp/godot-import.log; then
            echo 'Godot reported a script/import error.' >&2
            exit 1
          fi

      - name: Run core tests
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/run_tests.gd

      - name: Run schema migration tests
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/run_migration_tests.gd

      - name: Run race standings tests
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/run_race_progress_tests.gd

      - name: Run presentation and collision tests
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/run_presentation_tests.gd

      - name: Run procedural option tests
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/run_generation_options_tests.gd

      - name: Run sharing package tests
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/run_sharing_tests.gd

      - name: Run save recovery tests
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/run_save_recovery_tests.gd

      - name: Run ghost persistence tests
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/run_ghost_persistence_tests.gd

      - name: Run runtime asset catalog tests
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/run_asset_catalog_tests.gd

      - name: Run deterministic stress tests
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/run_stress_tests.gd

  windows-export:
    needs: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install export dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Download Godot 4.7.1 and export templates
        run: |
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          curl -fL --retry 3 \
            -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Import project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --editor --path . --quit-after 2 2>&1 | tee /tmp/godot-export-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' /tmp/godot-export-import.log; then
            echo 'Godot reported a script/import error before export.' >&2
            exit 1
          fi

      - name: Export Windows release and reject script errors
        shell: bash
        run: |
          mkdir -p build
          set +e
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --export-release "Windows Desktop" build/PixelTrackWorks.exe \
            > /tmp/godot-export.log 2>&1
          export_code=$?
          set -e

          echo '--- Godot Windows export tail ---'
          tail -n 120 /tmp/godot-export.log || true
          echo '--- Godot Windows export error matches ---'
          grep -nE 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR:|Export failed|Cannot export' /tmp/godot-export.log || true

          if [ "$export_code" -ne 0 ]; then
            echo "Godot export exited with code $export_code." >&2
            exit "$export_code"
          fi
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' /tmp/godot-export.log; then
            echo 'Godot reported a script error during export.' >&2
            exit 1
          fi
          test -s build/PixelTrackWorks.exe
          cd build
          zip -9 PixelTrackWorks-Windows-x64.zip PixelTrackWorks.exe

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PixelTrackWorks-export-diagnostics
          path: |
            /tmp/godot-export-import.log
            /tmp/godot-export.log
          if-no-files-found: warn
          retention-days: 3

      - name: Verify packaged Windows artifact
        run: |
          test -s build/PixelTrackWorks-Windows-x64.zip
          unzip -t build/PixelTrackWorks-Windows-x64.zip
          unzip -l build/PixelTrackWorks-Windows-x64.zip | grep -F 'PixelTrackWorks.exe'
          test "$(unzip -Z1 build/PixelTrackWorks-Windows-x64.zip | wc -l)" -eq 1
          sha256sum build/PixelTrackWorks-Windows-x64.zip | tee build/PixelTrackWorks-Windows-x64.zip.sha256
          test -s build/PixelTrackWorks-Windows-x64.zip.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelTrackWorks-Windows-x64
          path: |
            build/PixelTrackWorks-Windows-x64.zip
            build/PixelTrackWorks-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    needs: windows-export
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download packaged Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PixelTrackWorks-Windows-x64
          path: build

      - name: Boot packaged executable headlessly
        shell: pwsh
        run: |
          Expand-Archive -Path build\PixelTrackWorks-Windows-x64.zip -DestinationPath app -Force
          $stdout = Join-Path $PWD 'smoke-stdout.log'
          $stderr = Join-Path $PWD 'smoke-stderr.log'
          $exe = Join-Path $PWD 'app\PixelTrackWorks.exe'
          if (-not (Test-Path $exe)) { throw 'PixelTrackWorks.exe missing after extraction.' }
          $process = Start-Process -FilePath $exe -ArgumentList @('--headless','--quit-after','2') -PassThru -Wait -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) { throw "Packaged executable exited with code $($process.ExitCode)." }
          $combined = ''
          if (Test-Path $stdout) { $combined += (Get-Content $stdout -Raw) }
          if (Test-Path $stderr) { $combined += (Get-Content $stderr -Raw) }
          if ($combined -match 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script') {
            throw 'Packaged executable reported a script error.'
          }
